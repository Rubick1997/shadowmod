<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · shadowmod demo</title>
<style>
  :root {
    --bg: #fcfcfb; --card: #ffffff; --ink: #0b0b0b; --ink2: #52514e; --line: #e4e3df;
    --accent: #2a78d6; --danger: #c43c3b; --hi: #fdf0e9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1a1a19; --card: #232321; --ink: #f0efec; --ink2: #c3c2b7; --line: #3a3936;
            --accent: #3987e5; --danger: #e66767; --hi: #3a2a22; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; }
  .top { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 20px; margin: 0; }
  h1 a { color: inherit; text-decoration: none; }
  h2 { font-size: 16px; margin: 28px 0 4px; }
  .who { display: flex; gap: 16px; align-items: center; }
  a { color: var(--accent); }
  select, input, textarea, button { font: inherit; color: inherit; }
  select, input, textarea { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  .compose { display: grid; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  textarea { resize: vertical; width: 100%; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 7px 14px; cursor: pointer; justify-self: start; }
  button.danger { background: var(--danger); }
  .hint, .muted, .empty, time, .ctx { color: var(--ink2); font-size: 13px; }
  .post { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-top: 10px; }
  .post header { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .post time { margin-left: auto; }
  .post p { margin: 4px 0 0; overflow-wrap: anywhere; }
  table { width: 100%; border-collapse: collapse; background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: block; overflow-x: auto; }
  th, td { text-align: left; padding: 8px 10px; border-top: 1px solid var(--line); vertical-align: top; font-size: 14px; }
  th { border-top: 0; color: var(--ink2); font-weight: 600; font-size: 12px; }
  .score { display: inline-block; font-size: 12px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--line); margin: 1px 0; white-space: nowrap; }
  .score.hi { background: var(--hi); }
  .actions form { display: flex; gap: 6px; }
  .actions button { padding: 4px 10px; font-size: 13px; }
  code { font-size: 13px; }
  footer { margin-top: 40px; color: var(--ink2); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1><a href="/">shadowmod guestbook</a></h1>{{nav}}</div>
  {{main}}
  <footer>Demo only. Provider: {{provider}}. No auth: the dropdown picks who you are.</footer>
</div>
</body>
</html>
