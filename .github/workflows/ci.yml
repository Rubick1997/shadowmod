name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Testcontainers starts a fresh Postgres 16 using the runner's Docker.
      - run: npm test
      # The benchmark must reproduce from the committed cache with no API keys.
      - run: npm run bench -- --offline
      - run: git diff --exit-code bench/results/metrics.csv
